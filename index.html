<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/img/tapLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Font Awesome 아이콘 라이브러리 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!--
      네이버 지도 SDK는 여기서 불러오지 않는다.
      키 없이 로드하면 스크립트 자체는 받아지지만 지도를 그릴 때
      런타임 인증에 실패한다("Naver Maps API 인증 실패").
      오시는 길 페이지(Location.vue)에서 키와 함께 필요할 때만 로드한다.
    -->
    <script>
      // SDK 인증 실패 시 네이버가 호출하는 훅. 원인을 콘솔에 남긴다.
      window.navermap_authFailure = function () {
        console.error(
          '[NaverMaps] 인증 실패 — 클라이언트 ID가 없거나, 현재 도메인이 ' +
            '네이버 클라우드 콘솔의 Web 서비스 URL에 등록되지 않았습니다.'
        );
      };
    </script>
    <title>공명짐 - 진동 운동 전문 센터(통합운동전문센터)</title>
    <meta
      name="description"
      content="파워플레이트, 산소캡슐, 제로아이, SASOm7, 타워풀리, 얼라인 필라테스 등 퍼스널 트레이닝 전문 장비를 기반으로 한 제품 서비스는 물론, 교육 출강과 영상 제작까지 제공합니다. 건강과 비즈니스의 새로운 표준, 공명짐이 만들어갑니다.."
    />
    <meta
      name="keywords"
      content="공명짐, ResonEx, 파워플레이트, 필라테스, 영상편집"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
